[build]
  publish = "dist"
  command = "npm run build"

# Handle SPA routing - this is the correct way for Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables for production
[build.environment]
  # These will be set in Netlify dashboard
  VITE_SUPABASE_URL = ""
  VITE_SUPABASE_ANON_KEY = ""